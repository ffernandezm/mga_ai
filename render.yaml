services:
  - type: web
    name: mga-backend
    runtime: docker
    plan: free
    region: oregon
    branch: main_deployment
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      # Estas se configuran manualmente en el dashboard:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Opcional: múltiples dominios separados por coma.
      # Ej: https://mga-ai.vercel.app,https://mga-ai-git-main-usuario.vercel.app
      - key: FRONTEND_URLS
        sync: false
      # Opcional: permitir previews de Vercel por regex.
      # Ej: ^https://.*\\.vercel\\.app$
      - key: CORS_ALLOW_ORIGIN_REGEX
        sync: false
